services:
  - type: web
    name: sigha-api
    runtime: node
    plan: starter
    # Bun distribuido por Render; el repo ya fija packageManager bun@1.3.14
    buildCommand: |
      corepack enable
      bun install --frozen-lockfile
      bun run build
    startCommand: bun dist/main.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.17.0
      - key: BUN_VERSION
        value: 1.3.14
      - key: PORT
        value: 3000
      # Secrets (definir en el dashboard de Render, nunca en el repo):
      # DATABASE_URL, DB_SSL, JWT_SECRET, RESEND_API_KEY,
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CORS_ORIGINS
